<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Web Foundations — Learn HTML & CSS</title>
<style>
:root{--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--ink:#edf3fb;--muted:#a6b5c9;--line:#2a3b53;--cyan:#67e8f9;--gold:#f5c66b;--green:#8ce0b0;--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#1b3550,transparent 32%),var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}
button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),#8b9cff);display:grid;place-items:center;color:#102033;font-weight:900}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.brand h1{font-size:18px;margin:0}.top small,.tiny{color:var(--muted)}.layout{display:grid;grid-template-columns:275px 1fr;gap:20px}.side,.main,.card{background:rgba(18,29,46,.95);border:1px solid var(--line);border-radius:var(--r)}.side{padding:18px;height:max-content;position:sticky;top:16px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.track{height:7px;background:#26364b;border-radius:20px;margin:9px 0 18px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:width .25s}.nav{display:grid;gap:5px}.nav button{display:flex;gap:9px;align-items:center;text-align:left;border:0;border-radius:11px;background:transparent;color:var(--muted);padding:10px}.nav button:hover,.nav button.active{background:#20344b;color:var(--ink)}.num{font-size:11px;color:var(--cyan);width:20px}.done{color:var(--green);margin-left:auto}.main{padding:clamp(18px,3vw,34px);min-width:0}.hero{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px}.hero h2{font-size:clamp(26px,4vw,38px);line-height:1.12;margin:6px 0 10px;letter-spacing:-.04em}.hero p,.section p{color:var(--muted);margin:0}.pill{border:1px solid #426077;color:var(--cyan);padding:6px 10px;border-radius:99px;font-size:12px;white-space:nowrap;height:max-content}.section{margin:22px 0}.section h3{font-size:17px;margin:0 0 8px}.section p{margin:8px 0}.callout{border-left:3px solid var(--gold);background:#263043;padding:13px 16px;border-radius:0 12px 12px 0;margin:15px 0}.code{background:#080e18;border:1px solid #28394e;border-radius:12px;padding:14px;overflow:auto;color:#d5e7f6;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid #456078;border-radius:11px;padding:10px 14px;background:#20344b;color:var(--ink);font-weight:650}.btn.primary{background:var(--cyan);color:#09202b;border-color:var(--cyan)}.btn:disabled{opacity:.4;cursor:not-allowed}.quiz{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}.quiz label{display:flex;gap:10px;padding:9px;border-radius:9px;color:#d9e3ef;cursor:pointer}.quiz label:hover{background:#20344b}.feedback{margin-top:10px;font-weight:650}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:15px;background:var(--panel2)}.card p{font-size:13px;color:var(--muted)}.playground{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor{width:100%;min-height:190px;resize:vertical;background:#080e18;color:#d7ecf8;border:1px solid #334960;border-radius:12px;padding:13px;font:13px/1.55 ui-monospace,monospace}.preview{width:100%;height:300px;border:1px solid #334960;border-radius:12px;background:white}.footer{margin-top:22px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{display:block}.pill{display:inline-block;margin-top:12px}}
@media(max-width:600px){.shell{padding:12px}.top small{display:none}.main{padding:17px}.playground,.grid2{grid-template-columns:1fr}.footer{display:block}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="mark">&lt;/&gt;</div><div><div class="eyebrow">A hands-on learning path</div><h1>Web Foundations</h1></div></div><small>HTML · CSS · The craft of the web</small></header>
<div class="layout"><aside class="side"><div class="progress-head"><span>Your learning path</span><strong id="progressText">0 / 10</strong></div><div class="track"><div class="fill" id="progressFill"></div></div><nav class="nav" id="nav"></nav><p class="tiny" id="storageStatus" role="status">Your progress is saved in this browser.</p></aside><main class="main" id="content" aria-live="polite"></main></div></div>
<script>
const lessons=[
["How the web works","Start here","A website is a conversation between a browser and a server. HTML gives the page structure; CSS gives it appearance; JavaScript adds behavior.",[["The browser's job","Your browser requests files from a server, reads the HTML, follows references to CSS and images, then paints the page."],["The three layers","HTML is the skeleton, CSS is the clothing and layout, and JavaScript is the movement. You can build useful pages before writing JavaScript."],["A useful mental model","Think in layers: content first, presentation second, interaction third. Keeping those jobs separate makes sites easier to maintain."]],"Browser requests a page → server sends HTML → browser reads HTML → CSS styles it → page appears.",["Which technology primarily describes page structure?",["CSS","HTML","JavaScript"],1,"HTML describes document structure and semantics."]],
["Your first HTML document","HTML basics","HTML is made of elements. Most have an opening tag, content, and a closing tag. Together they form a document tree.",[["The document shell","A modern page begins with <!doctype html>, then html containing head and body. The head stores page information; body contains visible content."],["Elements and attributes","Attributes add information: href tells a link where to go, and alt describes an image."],["Nesting matters","Nest elements in the correct order. Close inner elements before outer elements, like closing boxes from the inside out."]],'<!doctype html>\\n<html lang="en">\\n  <head>\\n    <meta charset="utf-8">\\n    <title>My first page</title>\\n  </head>\\n  <body>\\n    <h1>Hello, web!</h1>\\n    <p>This is my first page.</p>\\n  </body>\\n</html>',["Where does visible page content normally go?",["Inside <head>","Inside <body>","Inside <title>"],1,"The body contains content displayed in the browser."]],
["Text, links & images","HTML content","Use elements that describe what content is—not just how you want it to look.",[["Headings and paragraphs","Use h1 through h6 for a meaningful heading hierarchy and p for paragraphs."],["Links","The anchor element creates a link: <a href=\"https://example.com\">Visit example</a>. Link text should explain the destination."],["Images and alt text","Use img with src and alt. Helpful alt text communicates an image's purpose; decorative images can use alt=\"\"."]],'<h1>Island journal</h1>\\n<p>Notes from the edge of the Pacific.</p>\\n<a href=\"https://example.com\">Explore more</a>\\n<img src=\"wave.jpg\" alt=\"A wave curling toward shore\">',["What is the purpose of an image's alt attribute?",["Add a border","Provide a text alternative","Resize the image"],1,"Alt text communicates an image's meaning when it cannot be seen."]],
["Semantic HTML","Meaningful structure","Semantic elements tell browsers and assistive technologies what different regions of a page mean.",[["Landmarks","header, nav, main, article, section, aside and footer describe common page regions."],["Choose the right element","Use button for an action and a for navigation. Use lists for groups of related items."],["Accessibility begins here","Good headings, labels, link text and landmarks make a site more usable. Accessibility is not a final coat of paint."]],'<header><h1>My site</h1></header>\\n<nav aria-label=\"Main navigation\"><a href=\"/\">Home</a></nav>\\n<main><article><h2>Latest story</h2><p>...</p></article></main>\\n<footer>Made with care.</footer>',["Which element identifies the page's main unique content?",["<main>","<span>","<b>"],0,"The main element identifies the page's dominant content."]],
["CSS: select and style","CSS foundations","CSS rules match elements and apply declarations. A selector chooses what to style; properties and values describe how.",[["A CSS rule","A rule looks like selector { property: value; }. For example, p { color: navy; } changes paragraph text color."],["Ways to add CSS","External stylesheets linked with link elements are best for most projects. Internal and inline styles have narrower uses."],["Selectors","Element selectors target tags, .class selectors target reusable classes, and #id selectors target one unique id."]],"h1 {\\n  color: #174a66;\\n  font-size: 2rem;\\n}\\n.card {\\n  background: #f2f6f8;\\n  padding: 1rem;\\n  border-radius: 12px;\\n}",["Which selector targets every element with class=\"card\"?",["#card",".card","card"],1,"A period selects a class. A hash selects an id."]],
["The box model","Spacing & sizing","Every element is a rectangular box. Understanding its dimensions is one of the biggest unlocks in CSS.",[["Four layers","From inside out: content, padding, border, margin. Padding is inside the border; margin is outside it."],["box-sizing","With box-sizing: border-box, declared width includes padding and border, making sizing more predictable."],["Spacing rhythm","Use consistent spacing values. rem units scale with root font size; percentages and viewport units help create fluid layouts."]],"* { box-sizing: border-box; }\\n.card { width: 320px; padding: 20px; border: 1px solid #ccc; margin: 16px; }",["Which space is outside an element's border?",["Padding","Content","Margin"],2,"Margin creates space outside the border."]],
["Layout with Flexbox","Modern layout","Flexbox arranges items in one dimension: a row or a column.",[["Make a flex container","Set display: flex on the parent. Its direct children become flex items."],["Control direction and alignment","flex-direction chooses row or column. justify-content distributes along the main axis; align-items aligns across the cross axis."],["Make room to breathe","Use gap for consistent space between items. flex-wrap can move items onto multiple lines."]],".toolbar {\\n  display: flex;\\n  align-items: center;\\n  justify-content: space-between;\\n  gap: 1rem;\\n  flex-wrap: wrap;\\n}",["Which property adds space between flex items?",["gap","float","z-index"],0,"The gap property sets spacing between items in flex and grid layouts."]],
["Responsive design","Design for every screen","Responsive design lets a page adapt to different screen sizes and viewing conditions.",[["Start with the viewport","Include the viewport meta tag so mobile browsers use the device width."],["Fluid foundations","Prefer flexible widths such as max-width: 100%, %, fr and minmax() where appropriate."],["Media queries","Use @media to change layout when available space crosses a breakpoint. Choose breakpoints based on your content."]],'<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\\n\\n.container { width: min(100% - 2rem, 70rem); margin: auto; }\\n@media (max-width: 600px) { .columns { display: block; } }',["What does a CSS media query help you do?",["Store user data","Apply styles based on viewport/device conditions","Create HTML elements"],1,"Media queries let CSS adapt to conditions such as viewport width."]],
["Forms & accessibility","Usable interfaces","Forms turn a page into a useful tool. Clear labels, sensible input types and keyboard-friendly controls matter.",[["Labels","Connect a label to an input with matching for and id. Placeholder text is a hint, not a replacement for a label."],["Choose input types","Use email for email addresses, password for passwords, and checkbox for independent on/off choices."],["Accessible interactions","Ensure controls are keyboard reachable, have visible focus, and explain errors in text. Color alone should never carry essential meaning."]],'<form>\\n  <label for=\"email\">Email address</label>\\n  <input id=\"email\" name=\"email\" type=\"email\" required>\\n  <button type=\"submit\">Subscribe</button>\\n</form>',["What gives an input a persistent, programmatic name?",["A label","A placeholder only","A page title"],0,"A label associates descriptive text with its form control."]],
["Build & publish a small site","Put it together","A finished website is more than code that works on your machine. Test it, organize it, and make it easy to find.",[["Project structure","Keep files understandable: index.html, styles.css, and an assets folder for images."],["Test before publishing","Check narrow and wide screens, keyboard navigation, links, alt text, page title and browser console."],["Publish","A static HTML/CSS site can be hosted by GitHub Pages or another static host. Commit your source files, enable hosting, then test the URL on a phone."]],"my-website/\\n├── index.html\\n├── styles.css\\n└── assets/\\n    └── hero.jpg",["Which file is commonly the default homepage of a static site?",["index.html","homepage.css","readme.txt"],0,"Static web servers commonly look for index.html as the directory's default document."]]
];
let current=0,done=[];
const nav=document.getElementById('nav'),content=document.getElementById('content');
const storageStatus=document.getElementById('storageStatus');
let savedProgress;
try{savedProgress=localStorage.getItem('webFoundationsDone')}catch{storageStatus.textContent='Browser storage is unavailable; progress will not be saved.'}
if(savedProgress!==null&&savedProgress!==undefined){try{let parsed=JSON.parse(savedProgress);if(Array.isArray(parsed)&&parsed.every(i=>Number.isInteger(i)&&i>=0&&i<lessons.length))done=[...new Set(parsed)];else storageStatus.textContent='Saved progress was invalid and has been reset.'}catch(error){if(!(error instanceof SyntaxError))throw error;storageStatus.textContent='Saved progress was invalid and has been reset.'}}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function progress(){document.getElementById('progressText').textContent=`${done.length} / ${lessons.length}`;document.getElementById('progressFill').style.width=done.length/lessons.length*100+'%'}
function render(){let l=lessons[current];nav.innerHTML=lessons.map((x,i)=>`<button class="${i===current?'active':''}" data-i="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${x[0]}</span>${done.includes(i)?'<span class="done">✓</span>':''}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()});progress();
content.innerHTML=`<div class="hero"><div><div class="eyebrow">Module ${String(current+1).padStart(2,'0')} · ${l[1]}</div><h2>${l[0]}</h2><p>${l[2]}</p></div><span class="pill">${done.includes(current)?'✓ Completed':'Learn at your pace'}</span></div>
${l[3].map((s,i)=>`<section class="section"><h3>${i+1}. ${s[0]}</h3><p>${s[1]}</p></section>`).join('')}
<section class="section"><h3>See the shape of it</h3><div class="code">${esc(l[4].replaceAll('\\n','\n'))}</div></section>
<div class="callout"><strong>Try this:</strong> Explain in your own words what each line or concept contributes. Understanding beats memorizing.</div>
<div class="quiz"><div class="eyebrow">Quick checkpoint</div><h3>${l[5][0]}</h3>${l[5][1].map((o,i)=>`<label><input type="radio" name="answer" value="${i}"> ${esc(o)}</label>`).join('')}<button class="btn" id="check">Check answer</button><div class="feedback" id="feedback"></div></div>
<div class="actions"><button class="btn" id="prev" ${current===0?'disabled':''}>← Previous</button><button class="btn primary" id="complete">${done.includes(current)?'Completed ✓':'Mark complete'}</button><button class="btn" id="next" ${current===9?'disabled':''}>Next lesson →</button></div>
${[1,4,6,7].includes(current)?`<section class="section"><h3>Mini playground</h3><p>Change the HTML or CSS and run your own preview. Experiment freely.</p><div class="playground"><div><div class="eyebrow">HTML</div><textarea class="editor" id="htmlCode"><h1>Hello, world!</h1>\n<p>I'm learning how the web works.</p>\n<a href="#">A sample link</a></textarea><div class="eyebrow">CSS</div><textarea class="editor" id="cssCode">body { font-family: system-ui; padding: 1rem; color: #18364b; }\nh1 { color: #087e8b; }\na { color: #b45309; }</textarea><button class="btn primary" id="run">Run preview</button></div><div><div class="eyebrow">Live preview</div><iframe class="preview" id="preview" title="Code playground preview" sandbox=""></iframe></div></div></section>`:''}
<div class="footer"><span>Web Foundations · Learn by making</span><span>${current+1} of 10</span></div>`;
document.getElementById('prev').onclick=()=>{current--;render()};document.getElementById('next').onclick=()=>{current++;render()};document.getElementById('complete').onclick=()=>{if(!done.includes(current))done.push(current);try{localStorage.setItem('webFoundationsDone',JSON.stringify(done));storageStatus.textContent='Your progress is saved in this browser.'}catch{storageStatus.textContent='Progress could not be saved in this browser.'}render()};
document.getElementById('check').onclick=()=>{let p=document.querySelector('input[name=answer]:checked'),f=document.getElementById('feedback');if(!p){f.textContent='Choose an answer first.';f.style.color='var(--gold)';return}let ok=+p.value===l[5][2];f.textContent=(ok?'Correct! ':'Not quite. ')+l[5][3];f.style.color=ok?'var(--green)':'var(--gold)'};
let run=document.getElementById('run');if(run){let frame=document.getElementById('preview');let update=()=>{let h=document.getElementById('htmlCode').value,c=document.getElementById('cssCode').value.replace(/<\/style/gi,'');frame.srcdoc=`<!doctype html><html><head><meta charset="utf-8"><style>${c}</style></head><body>${h.replace(/<script/gi,'&lt;script')}</body></html>`};run.onclick=update;update()}
}
render();
</script></body></html>
